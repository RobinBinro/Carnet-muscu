<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de muscu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muscu">
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
/* Layout idea: one narrow column built for a phone held in one hand at the gym.
   A dark "plate" slab carries the next session; everything else stays quiet. */
:root{
  --bg:#E9ECEF; --surface:#FFFFFF; --surface-2:#F3F5F7;
  --ink:#11151B; --muted:#56606D; --line:#CFD5DC;
  --slab:#11151B; --slab-ink:#F4F6F8; --slab-muted:#A7B0BC; --slab-line:#2C333D;
  --plate:#F5C518; --plate-ink:#11151B;
  --series:#2350D8; --danger:#B3261E;
  --body:#D5DAE1; --muscle:#B9C1CC; --hot:#D9381E;
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D;
    --ink:#EEF1F4; --muted:#9AA5B2; --line:#2D343F;
    --slab:#232A35; --slab-ink:#EEF1F4; --slab-muted:#A7B0BC; --slab-line:#394150;
    --plate:#F5C518; --plate-ink:#11151B;
    --series:#6E8CF5; --danger:#FF8A80;
    --body:#2A313B; --muscle:#414B59; --hot:#FF6A4D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#1F242D;
  --ink:#EEF1F4; --muted:#9AA5B2; --line:#2D343F;
  --slab:#232A35; --slab-ink:#EEF1F4; --slab-muted:#A7B0BC; --slab-line:#394150;
  --plate:#F5C518; --plate-ink:#11151B;
  --series:#6E8CF5; --danger:#FF8A80;
    --body:#2A313B; --muscle:#414B59; --hot:#FF6A4D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--series);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--plate);border:5px solid var(--ink)}
.tabs{display:flex;gap:4px}
.tabs a{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-align:center;padding:10px 2px 9px;text-decoration:none;color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:clamp(13px,3.7vw,18px);letter-spacing:.02em;text-transform:uppercase;border-bottom:4px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--plate)}

main{max-width:760px;margin:0 auto;padding:16px 16px 72px;display:flex;flex-direction:column;gap:16px}
.banner{max-width:760px;margin:0 auto;padding:0 16px}
.banner > div{margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--plate);border-radius:6px;background:var(--surface);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.eyebrow{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec-title{font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--plate);color:var(--plate-ink);border-color:var(--plate);font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;border-color:transparent;padding-left:6px;padding-right:6px}
.btn.ghost:hover{text-decoration:underline}
.btn.danger{color:var(--danger);background:transparent;border-color:transparent}
.btn.danger:hover{text-decoration:underline}
.btn.dashed{border-style:dashed;background:transparent;width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* slab: next session */
.slab{background:var(--slab);color:var(--slab-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--slab-line)}
.slab .eyebrow{color:var(--plate)}
.slab h1{font-size:clamp(38px,11vw,56px);font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.slab .meta{color:var(--slab-muted);font-size:15px}
.slab .btn.primary{align-self:flex-start}
.slab .alt{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--slab-line);padding-top:12px;align-items:center}
.slab .alt span{color:var(--slab-muted);font-size:14px}
.slab .alt button{background:transparent;color:var(--slab-ink);border:1px solid var(--slab-line);border-radius:999px;padding:7px 12px;min-height:38px;font-size:14px;font-weight:600}
.slab .alt button:hover{border-color:var(--slab-ink)}
.slab .alt button:disabled{opacity:.5}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.week i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:block}
.week .done i{background:var(--ink);border:7px solid var(--ink);box-shadow:inset 0 0 0 4px var(--plate)}
.week .plan i{border-style:dashed;border-color:var(--muted)}
.week .today{color:var(--ink)}
.week .today i{border-color:var(--ink)}
.week .done.today i{border-color:var(--ink)}

.hist-week{display:flex;flex-direction:column;gap:8px}
.hist-week h3{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sess{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sess:hover{border-color:var(--ink)}
.sess b{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:.02em;display:block;line-height:1.1}
.sess .d{font-size:13px;color:var(--muted);display:block}
.sess .d::first-letter{text-transform:uppercase}
.sess .s{font-size:14px;color:var(--muted);text-align:right;white-space:nowrap}
.sess .s strong{display:block;color:var(--ink);font-family:var(--font-display);font-size:20px;font-weight:700}

/* session editor */
.edit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.save-state{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr auto;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.fld input,.fld select,.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.ex{padding:14px;display:flex;flex-direction:column;gap:10px}
.ex header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex h3{font-size:26px;margin-top:4px;overflow-wrap:anywhere}
.ex .ex-actions{display:flex;gap:2px;flex-shrink:0}
.ex .last{font-size:14px;color:var(--muted)}
.sets{display:flex;flex-direction:column;gap:6px}
.sets-head,.set{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center}
.sets-head span:first-child{text-align:center}
.sets-head{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.set .n{font-family:var(--font-display);font-size:24px;font-weight:700;text-align:center;color:var(--muted)}
.set input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-height:48px;padding:6px 10px;font-family:var(--font-display);font-size:26px;font-weight:700;text-align:center;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.set input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.set input:focus{background:var(--surface)}
.set .x{border:0;background:transparent;color:var(--muted);font-size:22px;min-height:44px;border-radius:8px}
.set .x:hover{color:var(--danger)}

/* templates */
.tpl{padding:14px;display:flex;flex-direction:column;gap:8px}
.tpl h3{font-size:26px;text-transform:uppercase}
.tpl .when{font-size:14px;font-weight:600}
.seg.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px}
.seg.days button{min-width:0;padding-left:0;padding-right:0}
.tpl ol{margin:0;padding-left:20px;color:var(--muted);font-size:15px}
.tpl ol b{color:var(--ink);font-weight:500}
.tex{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.tex:first-of-type{border-top:0}
.tex .nm{font-weight:600;overflow-wrap:anywhere}
.tex .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;grid-column:1 / -1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);min-width:38px;min-height:38px;font-size:18px;font-weight:700}
.stepper span{min-width:64px;text-align:center;font-weight:600;font-size:14px}
.tex .reps{width:84px;min-height:38px;padding:6px 8px}

/* progression */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{padding:12px}
.tile .v{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1;margin:4px 0}
.tile .l{font-size:13px;font-weight:600;color:var(--muted)}
.tile .p{font-size:13px;color:var(--muted)}
.gbar{display:grid;grid-template-columns:112px 1fr 58px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.gbar .track{height:10px;display:block}
.gbar .fill{display:block;height:10px;background:var(--series);border-radius:0 4px 4px 0;min-width:2px}
.gbar .val{font-variant-numeric:tabular-nums;white-space:nowrap}
.gbar .val small{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--series);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--series);opacity:.1}
.chart .dot{fill:var(--series);stroke:var(--surface);stroke-width:2}
.chart .endv{fill:var(--ink);font-size:13px;font-weight:700}
.chart .cross{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.35;max-width:220px;z-index:2}
.tip strong{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facts > div{border-top:2px solid var(--ink);padding-top:6px}
.facts .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.1}
.facts .l{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;padding-right:0;padding-left:10px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheet-back{position:absolute;inset:0;background:rgba(8,10,14,.55)}
.sheet-panel{position:relative;background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88%;display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line)}
.sheet-panel h2{font-size:26px;text-transform:uppercase}
.sheet-panel.pick{height:92%;max-height:92%}
.sheet-panel.pick > .row.between{flex-wrap:nowrap;align-items:flex-start}
.sheet-panel.pick h2{font-size:22px;min-width:0;overflow-wrap:anywhere}
.sheet-panel.pick > .row.between .btn{flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;min-height:34px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{overflow-y:auto;flex:1;min-height:120px;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.plist h4{margin:10px 0 2px;font-family:var(--font-display);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plist button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:11px 4px;min-height:44px;font-weight:500}
.plist button:hover{background:var(--surface-2)}
.plist button small{color:var(--muted);font-weight:400}
details.newex summary{cursor:pointer;font-weight:600;padding:6px 0}
details.newex .row{margin-top:8px}
.linkname{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;text-transform:inherit;letter-spacing:inherit;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:4px;overflow-wrap:anywhere}
.linkname:hover{text-decoration-color:currentColor}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.lib{overflow:hidden}
.lib h3{font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px 14px 8px}
.lib button{display:flex;flex-direction:column;gap:1px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:10px 14px;min-height:48px}
.lib button:hover{background:var(--surface-2)}
.lib button b{font-weight:600}
.lib button small{color:var(--muted);font-size:13px}
.plist .prow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.plist .prow button{border-bottom:0}
.plist .prow > button:first-child{flex:1;min-width:0}
.plist .prow .info{flex-shrink:0;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline;padding:11px 8px}
#fiche{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
#fiche[hidden]{display:none}
.fiche-in{max-width:760px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:16px;outline:none}
.fiche-head{position:sticky;top:0;background:var(--bg);padding:8px 0 4px;z-index:1;border-bottom:1px solid var(--line)}
.fiche-in .slab h1{font-size:clamp(30px,8.5vw,44px)}
.fiche-in h2.eyebrow{font-size:15px}
.mmap svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto}
.mmap .b{fill:var(--body)}
.mmap .bl{stroke:var(--body);fill:none;stroke-linecap:round}
.mmap .m{fill:var(--muscle);stroke:var(--surface);stroke-width:1}
.mmap .m.p{fill:var(--hot)}
.mmap .m.s{fill:var(--hot);fill-opacity:.4}
.mmap .dv{stroke:var(--surface);stroke-width:1;fill:none}
.mmap text{font-family:var(--font-body);font-size:11px;font-weight:600;fill:var(--muted);text-anchor:middle;letter-spacing:.08em}
.mleg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mleg li{display:flex;gap:8px;align-items:baseline}
.mleg i{width:12px;height:12px;border-radius:3px;background:var(--hot);flex-shrink:0;display:inline-block}
.mleg i.s{opacity:.4}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;z-index:30;max-width:90%;display:none}
#toast.on{display:block}
body.gate .tabs{display:none}
.sync{font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:#1B7F4B}
.sync.wait i{background:var(--plate)}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (min-width:640px){
  #sheet{align-items:center}
  .sheet-panel{border-radius:16px}
  .top-in{flex-direction:row;justify-content:space-between;align-items:flex-end;padding-top:6px}
  .tabs a{flex:none;padding-left:16px;padding-right:16px}
}
@media (max-width:420px){
  .tiles{grid-template-columns:1fr 1fr}
  .tiles .tile:first-child{grid-column:1 / -1}
  .gbar{grid-template-columns:104px 1fr 58px}
  .fields{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: no-preference){
  .btn,.sess,.seg button,.chips button{transition:border-color .12s, background-color .12s}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand-row"><div class="brand"><i aria-hidden="true"></i>Carnet de muscu</div><span class="sync" id="sync" role="status"></span></div>
    <nav class="tabs" aria-label="Sections">

 "Reste droit, sans te pencher en arrière pour lancer la charge.|Les développés sollicitent déjà beaucoup l’avant de l’épaule : peu de séries suffisent."],
"Élévations frontales poulie": ["Poulie basse, barre droite ou corde", "delt_a", "delt_l",
 "Dos à la poulie, câble passant entre les jambes, saisis la barre devant les cuisses.|Monte les bras tendus devant toi jusqu’à hauteur des épaules.|Redescends lentement en retenant le câble.",
 "Garde les abdominaux gainés pour ne pas cambrer.|La tension est constante : inutile de charger lourd."],
"Oiseau haltères buste penché": ["Deux haltères légers (banc possible)", "delt_p", "mid trap",
 "Debout genoux fléchis ou assis au bord d’un banc, buste penché presque à l’horizontale, haltères sous la poitrine.|Écarte les bras sur les côtés, coudes légèrement fléchis, jusqu’à l’horizontale.|Redescends lentement.",
 "Pour cibler l’arrière de l’épaule plutôt que le milieu du dos, écarte les bras sans serrer fort les omoplates.|Garde la nuque dans l’alignement du dos."],
"Pec deck inversé": ["Machine pec deck réglée en position inversée", "delt_p", "mid trap",
 "Assis face au dossier, poitrine en appui, saisis les poignées bras tendus devant toi.|Écarte les bras vers l’arrière jusqu’à les aligner avec les épaules.|Reviens lentement vers l’avant.",
 "Règle le siège pour que les mains soient à hauteur des épaules.|Charge légère et mouvement contrôlé."],
"Face pull": ["Poulie haute, corde", "delt_p", "mid trap",
 "Poulie réglée à hauteur du visage, saisis la corde et recule d’un pas, bras tendus.|Tire la corde vers le visage en écartant les mains, coudes hauts.|Termine les mains de part et d’autre de la tête, puis reviens lentement.",
 "Pense à tourner les avant-bras vers l’arrière en fin de tirage.|Exercice de posture et de santé de l’épaule : privilégie la qualité à la charge."],
"Rowing menton": ["Barre, barre EZ ou poulie basse", "delt_l trap", "bi fa",
 "Debout, barre devant les cuisses, prise à la largeur des épaules ou un peu plus.|Tire la barre le long du corps en montant les coudes sur les côtés.|Arrête-toi quand les coudes atteignent la hauteur des épaules, puis redescends.",
 "Une prise large et une montée limitée à la hauteur des épaules sont plus confortables pour l’articulation.|Si tu ressens une gêne à l’épaule, remplace par des élévations latérales."],

/* ----- Trapèzes ----- */
"Shrugs barre": ["Barre (sangles possibles)", "trap", "fa",
 "Debout, barre tenue bras tendus devant les cuisses, prise à la largeur des épaules.|Hausse les épaules le plus haut possible vers les oreilles, bras tendus.|Marque une seconde en haut, puis redescends lentement.",
 "Le mouvement est vertical : ne fais pas rouler les épaules.|Garde les bras tendus, ce ne sont pas les biceps qui tirent."],
"Shrugs haltères": ["Deux haltères (sangles possibles)", "trap", "fa",
 "Debout, haltères le long du corps, paumes vers toi.|Hausse les épaules à la verticale le plus haut possible.|Tiens une seconde, puis redescends lentement jusqu’à l’étirement.",
 "Les haltères sur les côtés laissent une trajectoire plus naturelle qu’à la barre.|Regarde droit devant, sans avancer la tête."],
"Shrugs à la Smith": ["Barre guidée (Smith machine)", "trap", "fa",
 "Debout, barre guidée devant les cuisses, bras tendus.|Hausse les épaules à la verticale.|Tiens une seconde en haut, redescends lentement, puis reverrouille en fin de série.",
 "La barre guidée permet de se concentrer sur la contraction.|Peut aussi se faire dos à la barre, selon ton confort."],
"Shrugs poulie basse": ["Poulie basse, barre droite", "trap", "fa",
 "Debout face à la poulie basse, barre tenue bras tendus.|Hausse les épaules vers les oreilles.|Tiens une seconde, puis redescends en contrôle.",
 "La tension reste constante, y compris en bas du mouvement.|Recule légèrement pour que le câble ne frotte pas contre toi."],
"Marche du fermier": ["Deux haltères lourds, kettlebells ou trap bar, de la place pour marcher", "trap fa", "abs obl",
 "Soulève les charges comme pour un soulevé de terre, dos plat, et tiens-toi droit.|Marche à petits pas réguliers, épaules basses et en arrière, regard devant.|Repose les charges en fléchissant les jambes, dos plat.",
 "Note la distance ou la durée en secondes dans la colonne Reps.|Ne laisse pas les épaules s’enrouler vers l’avant."],

/* ----- Biceps ----- */
"Curl barre droite": ["Barre droite", "bi", "fa",
 "Debout, barre tenue bras tendus en supination, prise à la largeur des épaules, coudes le long du corps.|Fléchis les coudes pour monter la barre vers les épaules, sans avancer les coudes.|Redescends lentement jusqu’à l’extension presque complète.",
 "Le buste ne bouge pas : s’il se balance, la charge est trop lourde.|Si les poignets tirent, passe à la barre EZ."],
"Curl barre EZ": ["Barre EZ", "bi", "fa",
 "Debout, saisis la barre EZ sur ses parties inclinées, coudes le long du corps.|Monte la barre vers les épaules en gardant les coudes fixes.|Redescends lentement.",
 "La prise inclinée soulage les poignets par rapport à la barre droite.|Garde les coudes près des côtes pendant toute la série."],
"Curl haltères": ["Deux haltères", "bi", "fa",
 "Debout ou assis, haltères le long du corps, paumes vers l’intérieur.|Monte les deux haltères en tournant les paumes vers le haut pendant la montée.|Redescends lentement en revenant à la position de départ.",
 "La rotation du poignet (supination) fait partie du travail du biceps : termine paume vers l’épaule.|Ne lance pas les haltères avec le dos."],
"Curl haltères alterné": ["Deux haltères", "bi", "fa",
 "Debout ou assis, haltères le long du corps.|Monte un haltère en tournant la paume vers le haut, coude fixe.|Redescends-le complètement avant de monter l’autre.",
 "Travailler un bras à la fois permet de mieux se concentrer sur chaque côté.|Compte les répétitions par bras."],
"Curl incliné haltères": ["Banc incliné (45 à 60°), deux haltères", "bi", "fa",
 "Assis sur le banc incliné, dos appuyé, bras pendant à la verticale, paumes vers l’avant.|Monte les haltères sans avancer les coudes.|Redescends lentement jusqu’à l’étirement complet.",
 "La position étire le biceps : prends plus léger que debout.|Garde les épaules en arrière, contre le dossier."],
"Curl marteau": ["Deux haltères", "bi fa", "",
 "Debout, haltères le long du corps, paumes face à face.|Monte les haltères en gardant les paumes face à face, coudes fixes.|Redescends lentement.",
 "La prise neutre sollicite fortement le muscle sur le dessus de l’avant-bras, en plus du biceps.|Peut se faire en alterné ou en croisant devant la poitrine."],
"Curl marteau à la corde": ["Poulie basse, corde", "bi fa", "",
 "Debout face à la poulie basse, saisis la corde paumes face à face.|Monte les mains vers les épaules, coudes le long du corps.|Redescends lentement en retenant le câble.",
 "Recule d’un petit pas pour garder la tension en bas.|Écarte légèrement les brins de la corde en haut."],
"Curl pupitre (Larry Scott)": ["Pupitre à biceps, barre EZ ou haltère", "bi", "fa",
 "Assis, aisselles calées en haut du pupitre, bras à plat sur le coussin.|Monte la barre vers les épaules sans décoller les bras du coussin.|Redescends lentement jusqu’à l’extension presque complète.",
 "Ne verrouille pas brutalement les coudes en bas : l’articulation est en position vulnérable.|Le pupitre empêche de tricher : la charge sera plus légère qu’au curl debout."],
"Curl concentré": ["Un haltère, banc", "bi", "fa",
 "Assis, jambes écartées, coude calé contre l’intérieur de la cuisse, bras tendu.|Monte l’haltère vers l’épaule sans bouger le haut du bras.|Redescends lentement.",
 "Marque une seconde de contraction en haut.|Le buste reste penché et immobile."],
"Curl poulie basse": ["Poulie basse, barre droite ou EZ", "bi", "fa",
 "Debout face à la poulie basse, barre tenue en supination, coudes le long du corps.|Monte la barre vers les épaules.|Redescends lentement en retenant le câble.",
 "La tension est constante, y compris en haut du mouvement.|Recule d’un petit pas pour que les disques ne se reposent pas en bas."],
"Curl poulie haute vis-à-vis": ["Deux poulies hautes en vis-à-vis, poignées", "bi", "fa",
 "Debout au centre, saisis une poignée dans chaque main, bras tendus à l’horizontale.|Fléchis les coudes pour amener les mains vers les oreilles.|Reviens lentement bras tendus.",
 "Garde les coudes à hauteur des épaules, sans les laisser descendre.|Exercice de contraction : charge légère."],
"Curl araignée (spider curl)": ["Banc incliné (45°), barre EZ ou haltères", "bi", "fa",
 "Allonge-toi à plat ventre sur le banc incliné, bras pendant à la verticale devant toi.|Monte la charge en gardant le haut des bras vertical.|Redescends lentement jusqu’à l’extension.",
 "Aucun élan possible : la contraction en haut est très forte.|Garde la poitrine en appui sur le banc."],
"Curl à la machine": ["Machine à biceps", "bi", "fa",
 "Règle le siège pour que tes coudes soient dans l’axe de rotation, bras à plat sur le coussin.|Monte les poignées vers les épaules.|Redescends en contrôle sans laisser reposer la charge.",
 "Ne décolle pas les coudes du coussin.|Évite l’extension brutale en bas du mouvement."],
"Curl poulie dos à la machine (bayésien)": ["Poulie basse, poignée", "bi", "fa",
 "Dos à la poulie basse, poignée dans une main, avance d’un pas : le bras part légèrement en arrière du corps.|Fléchis le coude pour amener la main vers l’épaule, sans avancer le coude.|Redescends lentement jusqu’à l’étirement, bras derrière toi.",
 "Le biceps travaille en position étirée, comme au curl incliné.|Fais toutes les répétitions d’un bras, puis de l’autre."],
/* ----- Triceps ----- */
"Extension poulie haute barre": ["Poulie haute, barre droite ou en V", "tri", "",
 "Debout face à la poulie haute, saisis la barre en pronation, coudes collés au corps, avant-bras à l’horizontale.|Tends les bras vers le bas jusqu’à l’extension complète.|Remonte lentement jusqu’à l’horizontale, sans décoller les coudes.",
 "Seuls les avant-bras bougent : les coudes restent fixes le long du corps.|Ne te penche pas sur la barre pour pousser avec le poids du corps."],
"Extension poulie haute corde": ["Poulie haute, corde", "tri", "",
 "Debout face à la poulie haute, saisis la corde paumes face à face, coudes collés au corps.|Tends les bras vers le bas en écartant les brins de la corde en fin de mouvement.|Remonte lentement.",
 "L’écartement de la corde en bas renforce la contraction.|Garde les épaules basses."],
"Extension poulie haute un bras": ["Poulie haute, poignée", "tri", "",
 "Debout face à la poulie haute, saisis la poignée d’une main (en pronation ou en supination), coude contre le corps.|Tends le bras vers le bas jusqu’à l’extension complète.|Remonte lentement.",
 "Travailler un bras à la fois aide à corriger un déséquilibre entre les deux côtés.|Stabilise le coude avec l’autre main si besoin."],
"Barre au front": ["Banc plat, barre EZ", "tri", "",
 "Allongé, barre tenue bras tendus au-dessus de la poitrine, prise serrée.|Fléchis les coudes pour descendre la barre vers le front ou juste derrière la tête, haut des bras immobile.|Tends les bras pour revenir à la position de départ.",
 "Garde les coudes pointés vers le plafond, sans les laisser s’écarter.|Descendre derrière la tête plutôt que sur le front est souvent plus doux pour les coudes."],
"Extension nuque haltère": ["Un haltère, banc à dossier", "tri", "",
 "Assis, tiens l’haltère à deux mains au-dessus de la tête, bras tendus.|Fléchis les coudes pour descendre l’haltère derrière la nuque, coudes pointés vers le haut.|Tends les bras pour remonter.",
 "Garde les coudes aussi serrés que possible.|Gaine les abdominaux pour ne pas cambrer."],
"Extension nuque poulie corde": ["Poulie haute ou basse, corde", "tri", "",
 "Dos à la poulie, corde tenue derrière la nuque, coudes pointés vers l’avant et le haut, un pied devant.|Tends les bras vers l’avant et le haut.|Reviens lentement, mains derrière la nuque.",
 "La position bras levés étire la longue portion du triceps.|Le buste reste fixe, légèrement penché en avant."],
"Développé couché prise serrée": ["Banc plat, barre, supports", "tri", "pec delt_a",
 "Allongé comme pour un développé couché, saisis la barre à la largeur des épaules.|Descends la barre vers le bas de la poitrine en gardant les coudes près du corps.|Pousse jusqu’à l’extension des bras.",
 "Inutile de serrer les mains davantage que la largeur des épaules : cela force sur les poignets.|Les coudes frôlent les côtes pendant la descente."],
"Dips buste droit": ["Barres parallèles (lest possible)", "tri", "pec delt_a",
 "En appui bras tendus sur les barres, buste droit, jambes sous toi.|Descends en fléchissant les coudes vers l’arrière, près du corps.|Remonte jusqu’à l’extension des bras.",
 "Buste vertical et coudes serrés pour cibler les triceps plutôt que les pectoraux.|Limite la descente à ce que tes épaules supportent sans gêne."],
"Dips entre deux bancs": ["Deux bancs (ou un banc et une chaise stable)", "tri", "delt_a pec",
 "Mains en appui sur le bord d’un banc derrière toi, talons posés sur l’autre banc, fesses dans le vide.|Descends en fléchissant les coudes jusqu’à environ 90°.|Remonte en poussant jusqu’à tendre les bras.",
 "Garde le dos près du banc pour ménager les épaules.|Plus facile : pieds au sol, genoux fléchis. Plus dur : un disque posé sur les cuisses."],
"Dips à la machine": ["Machine à dips assis", "tri", "pec delt_a",
 "Assis, dos contre le dossier, mains sur les poignées de part et d’autre, coudes fléchis.|Pousse les poignées vers le bas jusqu’à l’extension des bras.|Remonte en contrôle sans laisser reposer la charge.",
 "Garde les coudes près du corps.|Boucle la ceinture ou cale-toi si la charge te soulève du siège."],
"Kickback haltère": ["Un haltère léger, banc", "tri", "",
 "Un genou et une main sur le banc, dos plat, haut du bras collé au buste et parallèle au sol.|Tends le bras vers l’arrière jusqu’à l’extension complète.|Reviens lentement à 90°.",
 "Le haut du bras ne bouge pas : seul l’avant-bras se déplace.|Charge légère, avec une seconde de contraction bras tendu."],
"Kickback poulie": ["Poulie basse, poignée ou câble nu", "tri", "",
 "Face à la poulie basse, buste penché, haut du bras collé au buste et parallèle au sol.|Tends le bras vers l’arrière.|Reviens lentement en retenant le câble.",
 "Le câble maintient la tension là où l’haltère la perd, en début de mouvement.|Garde le coude haut et immobile."],
"Pompes prise serrée": ["Poids du corps", "tri", "pec delt_a abs",
 "En position de pompe, mains à la largeur des épaules ou un peu plus serrées.|Descends en gardant les coudes le long du corps.|Pousse jusqu’à l’extension des bras.",
 "Garde le corps aligné, abdominaux et fessiers gainés.|Si les mains très rapprochées gênent les poignets, écarte-les légèrement."],

/* ----- Avant-bras ----- */
"Flexion des poignets barre": ["Barre ou haltères, banc", "fa", "",
 "Assis, avant-bras posés sur les cuisses ou sur un banc, paumes vers le haut, poignets dans le vide.|Laisse descendre la barre en ouvrant légèrement les doigts.|Referme les doigts et enroule les poignets vers le haut.",
 "Petite amplitude, mouvement lent, séries plutôt longues.|Les avant-bras restent en appui pendant toute la série."],
"Extension des poignets barre": ["Barre légère ou haltères, banc", "fa", "",
 "Assis, avant-bras posés sur les cuisses ou sur un banc, paumes vers le bas, poignets dans le vide.|Laisse descendre la barre en fléchissant les poignets.|Remonte en relevant le dos des mains vers toi.",
 "Les extenseurs sont bien plus faibles que les fléchisseurs : commence très léger.|Ne décolle pas les avant-bras."],
"Curl inversé barre": ["Barre droite", "fa", "bi",
 "Debout, barre tenue en pronation (paumes vers le bas), à la largeur des épaules.|Monte la barre vers les épaules, coudes le long du corps.|Redescends lentement.",
 "Garde les poignets droits, dans le prolongement des avant-bras.|La charge sera nettement plus légère qu’au curl classique."],
"Curl inversé barre EZ": ["Barre EZ", "fa", "bi",
 "Debout, saisis la barre EZ en pronation sur ses parties inclinées.|Monte la barre vers les épaules, coudes fixes.|Redescends lentement.",
 "La barre EZ est plus confortable pour les poignets que la barre droite.|Garde les poignets fermes."],
"Enroulement de poignets": ["Rouleau à poignets (barre courte, corde, disque léger)", "fa", "delt_a",
 "Debout, tiens le rouleau à deux mains, bras tendus devant toi ou coudes au corps.|Enroule la corde en tournant les poignets l’un après l’autre jusqu’à monter le disque.|Déroule lentement, en contrôlant la descente.",
 "Garder les coudes au corps évite que les épaules fatiguent avant les avant-bras.|Une montée et une descente comptent pour une répétition."],
"Suspension à la barre": ["Barre de traction", "fa", "lat",
 "Saisis la barre en pronation, à la largeur des épaules.|Suspends-toi bras tendus, épaules légèrement engagées vers le bas.|Tiens le plus longtemps possible, puis repose les pieds.",
 "Note la durée en secondes dans la colonne Reps.|Trop facile : ajoute un lest ou tiens à une main."],
"Pince à main": ["Pince de musculation (gripper)", "fa", "",
 "Cale la pince dans la paume, la branche appuyée contre la base du pouce.|Serre jusqu’à ce que les deux branches se touchent.|Relâche lentement.",
 "Choisis une résistance qui te permet de fermer complètement la pince.|Travaille les deux mains."],

/* ----- Abdominaux ----- */
"Crunch au sol": ["Tapis", "abs", "obl",
 "Allongé sur le dos, genoux fléchis, pieds au sol, mains aux tempes ou croisées sur la poitrine.|Enroule le buste en décollant les épaules du sol, en rapprochant les côtes du bassin.|Redescends lentement sans reposer complètement la tête.",
 "Le bas du dos reste au sol : c’est un enroulement, pas un redressement complet.|Ne tire pas sur la nuque avec les mains."],
"Crunch poulie haute": ["Poulie haute, corde", "abs", "obl",
 "À genoux face à la poulie haute, corde tenue de part et d’autre de la tête.|Enroule le buste vers le bas en rapprochant les coudes des genoux.|Remonte lentement, sans te redresser complètement.",
 "Les hanches restent fixes : si elles reculent, ce ne sont plus les abdominaux qui travaillent.|Les mains restent près de la tête pendant tout le mouvement."],
"Crunch à la machine": ["Machine à abdominaux", "abs", "",
 "Règle le siège, cale tes pieds et saisis les poignées.|Enroule le buste vers l’avant en contractant les abdominaux.|Reviens lentement sans laisser reposer la charge.",
 "Pousse avec les abdominaux, pas avec les bras.|Expire pendant l’enroulement."],
"Relevé de jambes suspendu": ["Barre de traction (sangles possibles)", "abs", "obl fa quad",
 "Suspendu à la barre, bras tendus, jambes tendues ou légèrement fléchies.|Monte les jambes devant toi en enroulant le bassin vers le haut.|Redescends lentement sans te balancer.",
 "C’est l’enroulement du bassin en haut du mouvement qui fait travailler les abdominaux.|Trop dur : monte seulement les genoux."],
"Relevé de genoux chaise romaine": ["Chaise romaine (appuis avant-bras et dossier)", "abs", "obl quad",
 "En appui sur les avant-bras, dos contre le dossier, jambes pendantes.|Monte les genoux vers la poitrine en enroulant le bassin.|Redescends lentement.",
 "Évite de balancer les jambes pour prendre de l’élan.|Plus dur : jambes tendues."],
"Relevé de jambes au sol": ["Tapis", "abs", "quad",
 "Allongé sur le dos, mains sous les fesses ou le long du corps, jambes tendues.|Monte les jambes à la verticale.|Redescends lentement sans poser les talons au sol.",
 "Garde le bas du dos plaqué au sol. S’il se creuse, descends moins bas ou fléchis les genoux.|Mouvement lent, sans élan."],
"Enroulement de bassin": ["Tapis ou banc", "abs", "",
 "Allongé sur le dos, cuisses à la verticale, genoux fléchis.|Décolle le bassin du sol en amenant les genoux vers la poitrine.|Redescends lentement.",
 "L’amplitude est courte : c’est le bassin qui s’enroule, pas les jambes qui se balancent.|Tiens-toi au banc derrière la tête si besoin."],
"Gainage planche": ["Tapis", "abs", "obl delt_a",
 "En appui sur les avant-bras et les pointes de pieds, coudes sous les épaules.|Aligne tête, dos, bassin et talons, abdominaux et fessiers contractés.|Tiens la position en respirant normalement.",
 "Note la durée en secondes dans la colonne Reps.|Si le bas du dos se creuse, arrête la série : la position n’est plus tenue."],
"Gainage latéral": ["Tapis", "obl", "abs abd",
 "Couché sur le côté, en appui sur l’avant-bras, coude sous l’épaule, pieds superposés.|Décolle le bassin pour aligner épaules, hanches et chevilles.|Tiens la position, puis change de côté.",
 "Note la durée en secondes par côté dans la colonne Reps.|Ne laisse pas le bassin reculer ni tomber."],
"Roulette abdominale": ["Roulette abdominale, tapis", "abs", "lat delt_a obl",
 "À genoux, mains sur la roulette, bras tendus sous les épaules.|Roule vers l’avant en gardant le dos plat et les abdominaux gainés, aussi loin que tu peux le contrôler.|Reviens en ramenant la roulette vers les genoux.",
 "Arrête-toi avant que le bas du dos ne se creuse.|Commence par de petites amplitudes, face à un mur qui sert de butée."],
"Rotation russe": ["Tapis (disque, haltère ou médecine-ball possible)", "obl", "abs",
 "Assis, genoux fléchis, buste incliné en arrière, dos droit.|Tourne les épaules d’un côté en amenant les mains près de la hanche.|Tourne de l’autre côté, en gardant le buste incliné.",
 "C’est le buste qui tourne, pas seulement les bras.|Pieds au sol pour débuter, décollés pour durcir."],
"Rotation à la poulie (bûcheron)": ["Poulie haute ou basse, poignée", "obl", "abs delt_a",
 "De profil à la poulie, saisis la poignée à deux mains, bras presque tendus.|Tire la poignée en diagonale à travers le corps, en tournant le buste et en pivotant sur le pied arrière.|Reviens lentement à la position de départ.",
 "Le mouvement part du tronc, les bras ne font que transmettre.|Fais toutes les répétitions d’un côté, puis de l’autre."],

 "Ne cambre pas en haut du mouvement : arrête-toi à l’alignement.|Plus dur : tiens un disque contre la poitrine."],
"Extension lombaires à la machine": ["Machine à lombaires", "low", "glute",

"Good morning": ["Barre, rack", "low ham", "glute",
 "Debout, barre posée sur le haut du dos, genoux légèrement fléchis.|Penche le buste vers l’avant en reculant les hanches, dos plat, jusqu’à sentir l’étirement des ischio-jambiers.|Redresse-toi en ramenant les hanches vers l’avant.",

"Superman": ["Tapis", "low", "glute",

function renderFiche(){

function openFiche(name){ if (!FICHES[name]) return; S.fiche = name; renderFiche(); }
function libList(){
  const q = slug(S.lib.q); let h = '';

    if (!q && S.lib.group && g !== S.lib.group) continue;
    const items = GROUPS[g].filter(n => { if (!q) return true; const f = FICHES[n]; return slug(n+' '+g+' '+f[0]+' '+(f[1]+' '+f[2]).split(' ').filter(Boolean).map(m => MUSCLES[m]).join(' ')).includes(q); });
    if (items.length) h += '<section class="card lib"><h3>'+esc(g)+' · '+items.length+'</h3>'+items.map(n => '<button data-action="fiche" data-n="'+esc(n)+'"><b>'+esc(n)+'</b><small>'+esc(FICHES[n][0])+'</small></button>').join('')+'</section>';
  }
  return h || '<div class="card empty">Aucun exercice ne correspond à cette recherche.</div>';

/* ---------- Dates et nombres ---------- */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseISO(s){ const p = String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function todayISO(){ return iso(new Date()); }
function addDays(s,n){ const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function monday(s){ const d = parseISO(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return iso(d); }
const DF_LONG = new Intl.DateTimeFormat('fr-FR',{weekday:'long', day:'numeric', month:'long'});

const NF = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const NF0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function fmtLong(s){ return DF_LONG.format(parseISO(s)); }
function fmtShort(s){ const d = parseISO(s); return (d.getFullYear() === new Date().getFullYear() ? DF_SHORT : DF_YEAR).format(d); }
function fmtN(n){ return NF.format(n); }
function parseNum(v){ v = String(v).trim().replace(',','.'); if (v === '') return null; const n = parseFloat(v); return isFinite(n) && n >= 0 ? n : null; }
function inputVal(n){ return n == null ? '' : String(n).replace('.',','); }

/* ---------- Calculs ---------- */
function exById(id){ return BY_ID[id] || (S.config.custom||[]).find(e => e.id === id) || null; }
function allExercises(){ return CATALOG.concat(S.config.custom||[]); }
function validSets(ex){ return (ex.sets||[]).filter(t => t && t.r > 0); }
function sessionStats(s){ let sets = 0, vol = 0; for (const ex of s.exercises||[]) for (const t of validSets(ex)) { sets++; vol += (t.w||0)*t.r; } return {sets:sets, vol:vol, exs:(s.exercises||[]).length}; }
function sortedSessions(){ return Object.values(S.sessions).sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created||0)-(a.created||0)); }
function perf(ex){
  const v = validSets(ex); if (!v.length) return null;
  let max = 0, vol = 0, reps = 0, e1 = 0;
  for (const t of v){ const w = t.w||0; if (w > max) max = w; vol += w*t.r; reps += t.r; const e = t.r === 1 ? w : w*(1+t.r/30); if (e > e1) e1 = e; }
  return {sets:v, max:max, vol:vol, reps:reps, e1rm:Math.round(e1*10)/10, n:v.length};
}
function historyOf(exId){
  const out = [];
  for (const s of sortedSessions().reverse()) for (const ex of s.exercises||[]) if (ex.exId === exId){ const p = perf(ex); if (p){ p.date = s.date; p.id = s.id; out.push(p); } }
  return out;
}
function lastPerf(exId, cur){
  for (const s of sortedSessions()){ if (s.id === cur.id || s.date > cur.date) continue; for (const ex of s.exercises||[]) if (ex.exId === exId){ const p = perf(ex); if (p){ p.date = s.date; return p; } } }
  return null;
}
function setsText(sets){
  const runs = [];
  for (const t of sets){ const w = t.w||0, last = runs[runs.length-1]; if (last && last.w === w) last.r.push(t.r); else runs.push({w:w, r:[t.r]}); }
  return runs.map(g => g.w ? fmtN(g.w)+' kg × '+g.r.join(', ') : g.r.join(', ')+' reps').join(' · ');
}
function weekAgg(ws){
  const we = addDays(ws,7), a = {sessions:0, sets:0, vol:0, groups:{}, days:{}};
  for (const s of Object.values(S.sessions)){ if (s.date < ws || s.date >= we) continue; const st = sessionStats(s); a.sessions++; a.sets += st.sets; a.vol += st.vol; a.days[s.date] = true;
    for (const ex of s.exercises||[]){ const n = validSets(ex).length; if (n) a.groups[ex.group] = (a.groups[ex.group]||0)+n; } }
  return a;
}
function nextTemplate(){
  const tpls = S.config.templates; if (!tpls.length) return null;
  for (const s of sortedSessions()){ const i = tpls.findIndex(t => t.id === s.tplId); if (i >= 0) return tpls[(i+1) % tpls.length]; }
  return tpls[0];
}
const DAYS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const DAYS_S = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function tplDays(t){ return Array.isArray(t.days) ? t.days.filter(d => d >= 0 && d <= 6).sort((a,b) => a-b) : []; }
function daysLabel(t){ const d = tplDays(t); return d.length ? 'Chaque '+d.map(i => DAYS[i]).join(' et ') : ''; }
function weekSlots(){
  const w0 = monday(todayISO()), w1 = addDays(w0,7), slots = [];
  for (const t of S.config.templates){
    const n = Object.values(S.sessions).filter(s => s.tplId === t.id && s.date >= w0 && s.date < w1).length;
    tplDays(t).forEach((d, i) => slots.push({tpl:t, d:d, done:i < n}));
  }
  return slots.sort((a,b) => a.d-b.d);
}
function suggestion(){
  const slots = weekSlots();
  if (!slots.length){ const t = nextTemplate(); return t ? {tpl:t, kind:'rotation'} : null; }
  const ti = (parseISO(todayISO()).getDay()+6)%7;
  let x = slots.find(s => s.d === ti && !s.done); if (x) return {tpl:x.tpl, kind:'today', d:x.d};
  x = slots.find(s => s.d < ti && !s.done); if (x) return {tpl:x.tpl, kind:'late', d:x.d};
  x = slots.find(s => s.d > ti && !s.done); if (x) return {tpl:x.tpl, kind:x.d === ti+1 ? 'tomorrow' : 'next', d:x.d};
  return {tpl:slots[0].tpl, kind:'nextweek', d:slots[0].d};
}

const FBX = window.FB || null, CFG = window.FIREBASE_CONFIG || null;

function normSession(s, id){ s.id = id; if (!Array.isArray(s.exercises)) s.exercises = []; for (const ex of s.exercises) if (!Array.isArray(ex.sets)) ex.sets = []; if (!s.date) s.date = todayISO(); return s; }
function writeFailed(e){

    catch(e){ C.fs = FBX.getFirestore(app); }
  } catch(e){ S.mode = 'setup'; S.setupError = String((e && e.message) || e); render(); return; }
  FBX.onAuthStateChanged(C.auth, user => { if (user) startCloud(user); else { stopCloud(); S.mode = 'signin'; S.editing = null; S.editingTpl = null; S.view = viewFromHash(); render(); } });
}
function stopCloud(){ (C.unsub||[]).forEach(u => { try { u(); } catch(e){} }); C.unsub = []; clearTimeout(C.slowT); C.uid = null; S.loaded = false; S.pendingSync = false; }
function startCloud(user){
  stopCloud();
  C.uid = user.uid; C.email = user.email || ''; S.mode = 'cloud'; S.slow = false; S.backup = null;
  S.sessions = {}; S.config = {templates:defaultTemplates(), custom:[]};
  C.configRef = FBX.doc(C.fs, 'users', user.uid, 'meta', 'config');
  C.sessCol = FBX.collection(C.fs, 'users', user.uid, 'sessions');
  let gotC = false, gotS = false;
  C.slowT = setTimeout(() => { if (!S.loaded){ S.slow = true; render(); } }, 10000);
  const ready = () => { if (gotC && gotS && !S.loaded){ S.loaded = true; S.slow = false; clearTimeout(C.slowT); restoreEditing(); render(); return; } softRender(); };
  const dead = e => { clearTimeout(C.slowT); S.slow = true; S.syncError = (e && e.code) || 'erreur'; softRender(); };
  C.unsub = [
    FBX.onSnapshot(C.configRef, snap => { const c = snap.exists() ? normConfig(clone(snap.data())) : null; if (S.mode === 'demo'){ S.cloudConfig = c; return; } if (c) S.config = c; gotC = true; ready(); }, dead),
    FBX.onSnapshot(C.sessCol, {includeMetadataChanges:true}, q => {
      const m = {}; q.forEach(d => { m[d.id] = normSession(clone(d.data()), d.id); });
      S.pendingSync = !!q.metadata.hasPendingWrites; S.fromCache = !!q.metadata.fromCache;
      if (S.mode === 'demo'){ if (S.backup) S.backup.sessions = m; paintSync(); return; }
      S.sessions = m; gotS = true; ready();
    }, dead)
  ];
  render();
}

/* ---------- Sauvegarde et restauration ---------- */
async function saveFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try {
    const f = new File([blob], name, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[f]}) && window.matchMedia && matchMedia('(pointer: coarse)').matches){ await navigator.share({files:[f], title:name}); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return true;
}
function buildBackup(){ return JSON.stringify({app:'carnet-muscu', v:1, exportedAt:new Date().toISOString(), config:S.config, sessions:sortedSessions().reverse()}, null, 1); }

  if (!d || d.app !== 'carnet-muscu' || !Array.isArray(d.sessions)){ toast('Ce fichier n’est pas une sauvegarde du carnet.'); return; }
  const list = d.sessions.filter(x => x && typeof x.id === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(x.id) && typeof x.date === 'string' && Array.isArray(x.exercises));
  const cfg = d.config && Array.isArray(d.config.templates) ? normConfig(d.config) : null;
  ask('Restaurer cette sauvegarde ?', plural(list.length,'séance','séances') + (cfg ? ' et ' + plural(cfg.templates.length,'modèle','modèles') : '') + ' vont être ajoutés à ton carnet. Une séance déjà présente avec le même identifiant est remplacée ; tes autres séances ne sont pas touchées.' + (cfg ? ' Tes modèles actuels sont remplacés par ceux de la sauvegarde.' : ''), 'Restaurer', async () => {
    if (S.mode !== 'cloud'){ toast('Connecte-toi pour restaurer une sauvegarde.'); return; }
    try {
      for (let i = 0; i < list.length; i += 400){ const b = FBX.writeBatch(C.fs); list.slice(i, i+400).forEach(x => { const c = normSession(clone(x), x.id); S.sessions[c.id] = c; b.set(FBX.doc(C.sessCol, c.id), c); }); b.commit().catch(writeFailed); }
      if (cfg){ S.config = cfg; storeSaveConfig(); }
      toast('Sauvegarde restaurée : ' + plural(list.length,'séance','séances') + '.'); render();
    } catch(e){ writeFailed(e); }

const DEMO_START = {'Développé couché barre':60,'Développé incliné haltères':22,'Tirage vertical poitrine':55,'Rowing barre':50,'Développé haltères assis':18,'Élévations latérales haltères':8,'Squat barre':80,'Presse à cuisses':140,'Leg extension':45,'Soulevé de terre roumain':70,'Leg curl allongé':35,'Extension mollets debout':60,'Curl barre EZ':30,'Curl incliné haltères':10,'Curl marteau':12,'Barre au front':25,'Extension poulie haute corde':20,'Dips buste droit':0};
function demoSessions(){
  const out = {}, tpls = defaultTemplates(), today = todayISO(), start = addDays(monday(today), -56);
  let n = 0;
  for (let w = 0; w <= 8; w++) [0,2,4].forEach((off, ti) => {
    const date = addDays(start, w*7+off); if (date > today) return;
    const t = tpls[ti], id = 'demo'+(n++);
    out[id] = {id:id, date:date, name:t.name, tplId:t.id, created:n, exercises:t.exercises.map((te, k) => {
      const b = DEMO_START[te.name] || 20, step = b >= 60 ? 2.5 : b >= 20 ? 1.25 : 0.5;
      const bump = Math.floor((w + (k % 2)) / 2), wgt = b ? b + bump*step*(b >= 20 ? 1 : 2) : 0;
      const top = parseInt(te.reps, 10) || 10;
      return {exId:te.exId, name:te.name, group:te.group, target:te.reps, sets:Array.from({length:te.sets}, (_, i) => ({w:wgt || null, r:Math.max(5, top + ((w+k)%2) - i)}))};
    })};
  });
  return out;
}

/* ---------- Export CSV (une ligne par série, format Excel français) ---------- */
function csvCell(v){
  let t = v == null ? '' : String(v);
  if (/^[=+\-@\t\r]/.test(t) && isNaN(Number(t.replace(',','.')))) t = "'" + t;
  return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
}
function buildCsv(){
  const rows = [['Date','Séance','Exercice','Groupe musculaire','Série','Poids (kg)','Répétitions','Volume (kg)']];
  const dec = n => String(Math.round(n*100)/100).replace('.',',');
  for (const s of sortedSessions().reverse()){
    const d = s.date.split('-'), date = d[2]+'/'+d[1]+'/'+d[0];
    for (const ex of s.exercises||[]) validSets(ex).forEach((t, i) => { const w = t.w||0; rows.push([date, s.name||'Séance', ex.name, ex.group, i+1, dec(w), t.r, dec(w*t.r)]); });
  }
  return {count:rows.length-1, text:'\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n') + '\r\n'};
}
async function exportCsv(){
  persistEditing();
  const csv = buildCsv();
  if (!csv.count){ toast('Aucune série enregistrée à exporter.'); return; }
  try { if (await saveFile('carnet-muscu-' + todayISO() + '.csv', csv.text, 'text/csv')) toast('Export prêt : ' + plural(csv.count,'série','séries') + '.'); }
  catch(e){ toast('Export impossible sur cet appareil.'); }
}

/* ---------- Courbe ---------- */
function niceTicks(min, max, count){
  if (min === max){ const pad = Math.max(1, Math.abs(min)*0.05); min -= pad; max += pad; }
  const raw = (max-min)/count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw/mag;
  const step = (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10)*mag;
  const lo = Math.max(0, Math.floor(min/step)*step), hi = Math.ceil(max/step)*step, t = [];
  for (let v = lo; v <= hi+step/2; v += step) t.push(+v.toFixed(6));
  return t;
}
function drawProgressChart(){
  const el = $('#chart'); if (!el) return;
  const h = historyOf(S.prog.exId), k = S.prog.metric, unit = METRICS[k].u;
  const pts = h.map(p => ({date:p.date, v:p[k], detail:setsText(p.sets)}));
  el.innerHTML = '';
  if (!pts.length) return;
  const W = Math.max(280, el.clientWidth || 320), H = 230, m = {l:44, r:54, t:16, b:28};
  const xs = pts.map(p => parseISO(p.date).getTime()), x0 = xs[0], x1 = xs[xs.length-1];
  const ticks = niceTicks(Math.min.apply(null, pts.map(p => p.v)), Math.max.apply(null, pts.map(p => p.v)), 4);
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = t => x1 === x0 ? m.l+(W-m.l-m.r)/2 : m.l+(t-x0)/(x1-x0)*(W-m.l-m.r);
  const Y = v => m.t+(1-(v-y0)/(y1-y0))*(H-m.t-m.b);
  const P = pts.map((p, i) => ({x:X(xs[i]), y:Y(p.v)}));
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" tabindex="0" aria-label="Courbe de progression. Utilise les flèches gauche et droite pour lire chaque séance. Les valeurs figurent aussi dans le tableau ci-dessous.">';
  for (const t of ticks) s += '<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text x="'+(m.l-8)+'" y="'+(Y(t)+4).toFixed(1)+'" text-anchor="end">'+fmtN(t)+'</text>';
  const want = Math.max(2, Math.floor((W-m.l-m.r)/90)+1), idx = [];
  for (let i = 0; i < want; i++) idx.push(Math.round(i*(pts.length-1)/(want-1)));
  const placed = [];
  for (const i of [...new Set(idx)]){ if (placed.length && P[i].x - P[placed[placed.length-1]].x < 62){ if (i === pts.length-1) placed[placed.length-1] = i; continue; } placed.push(i); }
  for (const i of placed) s += '<text x="'+P[i].x.toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(pts.length === 1 ? 'middle' : i === 0 ? 'start' : i === pts.length-1 ? 'end' : 'middle')+'">'+esc(DF_SHORT.format(parseISO(pts[i].date)))+'</text>';
  if (pts.length > 1){
    const d = P.map((p, i) => (i ? 'L' : 'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    s += '<path class="ar" d="'+d+' L'+P[P.length-1].x.toFixed(1)+' '+(H-m.b)+' L'+P[0].x.toFixed(1)+' '+(H-m.b)+' Z"/><path class="ln" d="'+d+'"/>';
    if (pts.length <= 14) for (let i = 0; i < P.length-1; i++) s += '<circle class="dot" cx="'+P[i].x.toFixed(1)+'" cy="'+P[i].y.toFixed(1)+'" r="4"/>';
  }
  const E = P[P.length-1];
  s += '<line class="cross" id="cx" y1="'+m.t+'" y2="'+(H-m.b)+'" x1="0" x2="0" visibility="hidden"/>';
  s += '<circle class="dot" cx="'+E.x.toFixed(1)+'" cy="'+E.y.toFixed(1)+'" r="5"/><text class="endv" x="'+(E.x+10).toFixed(1)+'" y="'+(E.y+4).toFixed(1)+'">'+fmtN(pts[pts.length-1].v)+'</text>';
  s += '<circle class="dot" id="hd" r="6" cx="0" cy="0" visibility="hidden"/><rect id="hit" x="'+m.l+'" y="0" width="'+(W-m.l-m.r+20)+'" height="'+H+'" fill="transparent"/></svg>';
  el.innerHTML = s;
  if (pts.length === 1){ const n = document.createElement('p'); n.className = 'small muted'; n.textContent = 'Une seule séance pour l’instant : la courbe se dessine à partir de la deuxième.'; el.appendChild(n); }
  const svg = $('svg', el), tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; el.appendChild(tip);
  const cx = $('#cx', el), hd = $('#hd', el); let curI = -1;
  function show(i){
    curI = i; const p = P[i];
    cx.setAttribute('x1', p.x); cx.setAttribute('x2', p.x); cx.setAttribute('visibility','visible');
    hd.setAttribute('cx', p.x); hd.setAttribute('cy', p.y); hd.setAttribute('visibility','visible');
    tip.textContent = '';
    const st = document.createElement('strong'); st.textContent = fmtN(pts[i].v)+(unit ? ' '+unit : ''); tip.appendChild(st);
    const d1 = document.createElement('div'); d1.textContent = fmtLong(pts[i].date); tip.appendChild(d1);
    const d2 = document.createElement('div'); d2.textContent = pts[i].detail; tip.appendChild(d2);
    tip.hidden = false;
    const sc = svg.getBoundingClientRect().width / W, tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = p.x*sc - tw/2; left = Math.max(0, Math.min(left, el.clientWidth - tw));
    let top = p.y*sc - th - 12; if (top < 0) top = p.y*sc + 14;
    tip.style.left = left+'px'; tip.style.top = top+'px';
  }
  function hide(){ curI = -1; tip.hidden = true; cx.setAttribute('visibility','hidden'); hd.setAttribute('visibility','hidden'); }
  function near(ev){ const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width; let b = 0, bd = Infinity; P.forEach((p, i) => { const d = Math.abs(p.x-x); if (d < bd){ bd = d; b = i; } }); show(b); }
  svg.addEventListener('pointermove', near); svg.addEventListener('pointerdown', near);
  svg.addEventListener('pointerleave', hide);
  svg.addEventListener('focus', () => { if (curI < 0) show(P.length-1); }); svg.addEventListener('blur', hide);
  svg.addEventListener('keydown', ev => { if (ev.key === 'ArrowLeft'){ show(Math.max(0, (curI < 0 ? P.length : curI)-1)); ev.preventDefault(); } else if (ev.key === 'ArrowRight'){ show(Math.min(P.length-1, curI+1)); ev.preventDefault(); } });
}

/* ---------- Séance : édition ---------- */
function newSession(tplId){
  const t = S.config.templates.find(x => x.id === tplId);
  S.editing = {id:uid(), date:todayISO(), name:t ? t.name : 'Séance libre', tplId:t ? t.id : '', created:Date.now(),
    exercises:t ? t.exercises.map(e => ({exId:e.exId, name:e.name, group:e.group, target:e.reps||'', sets:Array.from({length:Math.max(1, e.sets||3)}, () => ({w:null, r:null}))})) : []};
  S.dirty = false; S.saveState = 'new'; S.view = 'seance'; render(); window.scrollTo(0,0);
}
function openSession(id){ const s = S.sessions[id]; if (!s) return; S.editing = clone(s); S.dirty = false; S.saveState = 'saved'; S.view = 'seance'; render(); window.scrollTo(0,0); }
function touchSession(){ S.dirty = true; S.saveState = 'dirty'; paintSaveState(); clearTimeout(S.saveTimer); S.saveTimer = setTimeout(persistEditing, 700); }
function persistEditing(){
  clearTimeout(S.saveTimer);
  if (!S.editing || !S.dirty) return;
  S.dirty = false; S.editing.updated = Date.now();
  const copy = clone(S.editing); S.sessions[copy.id] = copy; S.saveState = 'saved'; storeSaveSession(copy); paintSaveState();
}
function paintSaveState(){
  const el = $('#save-state'); if (!el) return;
  el.textContent = S.saveState === 'new' ? 'Rien à enregistrer pour l’instant' : S.saveState === 'dirty' ? 'Enregistrement…' : S.saveState === 'error' ? 'Non enregistré'
    : S.mode === 'demo' ? 'Exemple : non enregistré' : S.pendingSync ? 'Enregistré sur le téléphone, envoi au retour du réseau' : 'Enregistré et synchronisé';
}
function restoreEditing(){ if (S.wantEdit && S.sessions[S.wantEdit]){ S.editing = clone(S.sessions[S.wantEdit]); S.saveState = 'saved'; S.view = 'seance'; } S.wantEdit = null; }
function leaveEditor(){ persistEditing(); S.editing = null; S.view = 'seances'; render(); window.scrollTo(0,0); }

/* ---------- Sélecteur d'exercice ---------- */
function openPicker(ctx, mode, index){
  const list = ctx === 'session' ? S.editing.exercises : S.editingTpl.exercises, cur = mode === 'replace' ? list[index] : null;
  S.picker = {ctx:ctx, mode:mode, index:index, group:cur ? cur.group : '', q:'', title:cur ? 'Remplacer « '+cur.name+' »' : 'Ajouter un exercice'};
  renderSheet();
}
function renderSheet(){
  const el = $('#sheet');
  if (S.confirm){
    el.hidden = false;
    el.innerHTML = '<div class="sheet-back" data-action="sheet-close"></div><div class="sheet-panel" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" tabindex="-1"><h2 id="cf-t">'+esc(S.confirm.title)+'</h2><p class="muted">'+esc(S.confirm.text)+'</p><div class="row end"><button class="btn" data-action="sheet-close">Annuler</button><button class="btn danger" style="border-color:var(--danger)" data-action="confirm-yes">'+esc(S.confirm.yes)+'</button></div></div>';
    $('.sheet-panel', el).focus(); return;
  }
  const p = S.picker; if (!p){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = '<div class="sheet-back" data-action="sheet-close"></div><div class="sheet-panel pick" role="dialog" aria-modal="true" aria-labelledby="pk-t" tabindex="-1">'
    + '<div class="row between"><h2 id="pk-t">'+esc(p.title)+'</h2><button class="btn ghost sm" data-action="sheet-close">Fermer</button></div>'
    + '<input class="inp" id="pick-q" type="search" placeholder="Rechercher un exercice" aria-label="Rechercher un exercice" autocomplete="off">'
    + '<div class="chips" id="pick-groups"></div><div class="plist" id="pick-list"></div>'
    + '<details class="newex"><summary>Il manque un exercice ? Crée-le</summary><div class="row"><input class="inp" id="new-name" placeholder="Nom de l’exercice" aria-label="Nom du nouvel exercice" style="flex:2;min-width:160px" autocomplete="off">'
    + '<select class="inp" id="new-group" aria-label="Groupe musculaire" style="flex:1;min-width:130px">'+GROUP_NAMES.map(g => '<option'+(g === p.group ? ' selected' : '')+'>'+esc(g)+'</option>').join('')+'</select>'
    + '<button class="btn" data-action="pick-create">Créer et choisir</button></div></details></div>';
  paintPicker(); $('.sheet-panel', el).focus();
}
function paintPicker(){
  const p = S.picker; if (!p) return;
  const chips = $('#pick-groups');
  if (!chips.firstChild) chips.innerHTML = [''].concat(GROUP_NAMES).map(g => '<button data-action="pick-group" data-g="'+esc(g)+'">'+(g ? esc(g) : 'Tous')+'</button>').join('');
  chips.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === p.group)));
  const q = slug(p.q), items = allExercises().filter(e => (q ? true : !p.group || e.group === p.group) && (!q || slug(e.name).includes(q) || slug(e.group).includes(q)));
  let h = '', g = null;
  for (const e of items.sort((a,b) => GROUP_NAMES.indexOf(a.group)-GROUP_NAMES.indexOf(b.group))){ if (e.group !== g){ g = e.group; h += '<h4>'+esc(g)+'</h4>'; } h += '<div class="prow"><button data-action="pick" data-id="'+esc(e.id)+'">'+esc(e.name)+(e.custom ? ' <small>· perso</small>' : '')+'</button>'+(FICHES[e.name] && !e.custom ? '<button class="info" data-action="fiche" data-n="'+esc(e.name)+'" aria-label="Fiche de '+esc(e.name)+'">Fiche</button>' : '')+'</div>'; }
  $('#pick-list').innerHTML = h || '<p class="muted small" style="padding:14px 4px">Aucun exercice ne correspond. Tu peux le créer juste en dessous.</p>';
}
function pickChoose(e){
  const p = S.picker; if (!p || !e) return;
  if (p.ctx === 'session'){
    const list = S.editing.exercises;
    if (p.mode === 'replace'){ const x = list[p.index]; x.exId = e.id; x.name = e.name; x.group = e.group; }
    else list.push({exId:e.id, name:e.name, group:e.group, target:'', sets:[{w:null,r:null},{w:null,r:null},{w:null,r:null}]});
    touchSession();
  } else {
    const list = S.editingTpl.exercises;
    if (p.mode === 'replace'){ const x = list[p.index]; x.exId = e.id; x.name = e.name; x.group = e.group; }
    else list.push({exId:e.id, name:e.name, group:e.group, sets:3, reps:'10'});
  }
  S.picker = null; renderSheet(); render();
}
function closeSheet(){ S.picker = null; S.confirm = null; renderSheet(); }
function ask(title, text, yes, fn){ S.confirm = {title:title, text:text, yes:yes, fn:fn}; renderSheet(); }
let toastT = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4200); }

/* ---------- Événements ---------- */
const ACT = {
  's-new': d => newSession(d.tpl),
  's-open': d => openSession(d.id),
  'back': () => leaveEditor(),
  's-delete': () => ask('Supprimer cette séance ?', 'Les séries enregistrées pour cette séance seront retirées de ton historique et de tes courbes.', 'Supprimer', () => {
    const id = S.editing.id, existed = !!S.sessions[id]; clearTimeout(S.saveTimer); S.dirty = false; S.editing = null; delete S.sessions[id]; if (existed) storeDeleteSession(id); S.view = 'seances'; render(); }),
  'set-add': d => { const ex = S.editing.exercises[+d.e], prev = ex.sets[ex.sets.length-1]; ex.sets.push({w:prev ? prev.w : null, r:null}); touchSession(); render(); const f = $('#'+(prev && prev.w != null ? 'r' : 'w')+'-'+d.e+'-'+(ex.sets.length-1)); if (f) f.focus(); },
  'set-remove': d => { S.editing.exercises[+d.e].sets.splice(+d.s, 1); touchSession(); render(); },
  'ex-add': () => openPicker('session','add'),
  'ex-replace': d => openPicker('session','replace', +d.e),
  'ex-remove': d => { const ex = S.editing.exercises[+d.e]; const go = () => { S.editing.exercises.splice(+d.e, 1); touchSession(); render(); };
    if (validSets(ex).length) ask('Retirer '+ex.name+' ?', 'Les séries déjà saisies pour cet exercice seront supprimées de cette séance.', 'Retirer', go); else go(); },
  'tpl-new': () => { S.editingTpl = {id:'tpl-'+uid(), name:'', exercises:[]}; S.tplIsNew = true; S.view = 'modele'; render(); window.scrollTo(0,0); },
  'tpl-edit': d => { const t = S.config.templates.find(x => x.id === d.id); if (!t) return; S.editingTpl = clone(t); S.tplIsNew = false; S.view = 'modele'; render(); window.scrollTo(0,0); },
  'tpl-cancel': () => { S.editingTpl = null; S.view = 'programme'; render(); },
  'tpl-save': () => { const t = S.editingTpl; t.name = (t.name||'').trim() || 'Séance sans nom'; const i = S.config.templates.findIndex(x => x.id === t.id); if (i >= 0) S.config.templates[i] = t; else S.config.templates.push(t); storeSaveConfig(); S.editingTpl = null; S.view = 'programme'; render(); toast(S.mode === 'demo' ? 'Exemple : modèle non enregistré.' : 'Modèle enregistré.'); },
  'tpl-delete': () => ask('Supprimer ce modèle ?', 'Les séances déjà enregistrées avec ce modèle restent dans ton historique.', 'Supprimer', () => { S.config.templates = S.config.templates.filter(x => x.id !== S.editingTpl.id); storeSaveConfig(); S.editingTpl = null; S.view = 'programme'; render(); }),
  'tpl-day': d => { const t = S.editingTpl, i = +d.d, cur = tplDays(t); t.days = cur.includes(i) ? cur.filter(x => x !== i) : cur.concat([i]).sort((a,b) => a-b); render(); },
  'tex-add': () => openPicker('tpl','add'),
  'tex-replace': d => openPicker('tpl','replace', +d.i),
  'tex-remove': d => { S.editingTpl.exercises.splice(+d.i, 1); render(); },
  'tex-up': d => { const l = S.editingTpl.exercises, i = +d.i; if (i > 0){ l.splice(i-1, 0, l.splice(i, 1)[0]); render(); } },
  'tex-down': d => { const l = S.editingTpl.exercises, i = +d.i; if (i < l.length-1){ l.splice(i+1, 0, l.splice(i, 1)[0]); render(); } },
  'tex-less': d => { const e = S.editingTpl.exercises[+d.i]; e.sets = Math.max(1, (e.sets||1)-1); render(); },
  'tex-more': d => { const e = S.editingTpl.exercises[+d.i]; e.sets = Math.min(12, (e.sets||1)+1); render(); },
  'metric': d => { S.prog.metric = d.m; render(); },
  'fiche': d => openFiche(d.n),
  'fiche-close': () => { S.fiche = null; renderFiche(); },
  'lib-group': d => { S.lib.group = d.g; S.lib.q = ''; render(); },
  'export-csv': () => { exportCsv(); },
  'backup-save': () => { exportBackup(); },
  'backup-pick': () => { const f = $('#restore-file'); f.value = ''; f.click(); },
  'auth-in': () => { authDo('in'); },
  'auth-up': () => { authDo('up'); },
  'auth-reset': () => { authDo('reset'); },
  'auth-out': () => { if (S.pendingSync) ask('Se déconnecter maintenant ?', 'Des saisies n’ont pas encore été envoyées sur ton compte. Attends d’avoir du réseau et l’indication « Synchronisé » avant de te déconnecter, sinon elles pourraient être perdues.', 'Se déconnecter quand même', signOutNow); else signOutNow(); },
  'demo-enter': () => enterDemo(),
  'demo-exit': () => exitDemo(),
  'sheet-close': () => closeSheet(),
  'confirm-yes': () => { const fn = S.confirm && S.confirm.fn; S.confirm = null; renderSheet(); if (fn) fn(); },
  'pick-group': d => { S.picker.group = d.g; S.picker.q = ''; const q = $('#pick-q'); if (q) q.value = ''; paintPicker(); const l = $('#pick-list'); if (l) l.scrollTop = 0; },
  'pick': d => pickChoose(exById(d.id)),
  'pick-create': () => { const name = ($('#new-name').value||'').trim(), group = $('#new-group').value; if (!name){ toast('Donne un nom à l’exercice.'); $('#new-name').focus(); return; }
    const e = {id:'perso.'+uid(), name:name.slice(0,80), group:group, custom:true}; S.config.custom = (S.config.custom||[]).concat([e]); storeSaveConfig(); pickChoose(e); }
};
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-action]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.action]; if (fn){ ev.preventDefault(); fn(b.dataset); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.k && S.editing){ const set = S.editing.exercises[+t.dataset.e].sets[+t.dataset.s]; const n = parseNum(t.value); set[t.dataset.k] = t.dataset.k === 'r' && n != null ? Math.round(n) : n; touchSession(); }
  else if (t.dataset.f === 'name' && S.editing){ S.editing.name = t.value; touchSession(); }
  else if (t.dataset.tf === 'name' && S.editingTpl){ S.editingTpl.name = t.value; }
  else if (t.dataset.tr != null && S.editingTpl){ S.editingTpl.exercises[+t.dataset.tr].reps = t.value.trim(); }
  else if (t.id === 'pick-q' && S.picker){ S.picker.q = t.value; paintPicker(); }
  else if (t.id === 'lib-q'){ S.lib.q = t.value; const l = $('#lib-list'); if (l) l.innerHTML = libList(); }
});
document.addEventListener('submit', ev => { if (ev.target.id === 'auth-form'){ ev.preventDefault(); authDo('in'); } });
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'restore-file'){ const f = t.files && t.files[0]; if (f){ const r = new FileReader(); r.onload = () => restoreFromText(String(r.result||'')); r.onerror = () => toast('Lecture du fichier impossible.'); r.readAsText(f); } return; }
  if (t.dataset.f === 'date' && S.editing && t.value){ S.editing.date = t.value; touchSession(); render(); }
  else if (t.id === 'p-ex'){ S.prog.exId = t.value; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.fiche){ S.fiche = null; renderFiche(); return; }
  if (ev.key === 'Escape' && (S.picker || S.confirm)) closeSheet();
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.k){ const all = [...document.querySelectorAll('.set input')], i = all.indexOf(ev.target); if (all[i+1]) all[i+1].focus(); else ev.target.blur(); }
  if (ev.key === 'Enter' && ev.target.id === 'new-name') ACT['pick-create']();
});
function viewFromHash(){ const h = location.hash.replace('#',''); return h === 'programme' || h === 'progression' || h === 'exercices' ? h : 'seances'; }
window.addEventListener('online', paintSync); window.addEventListener('offline', paintSync);
window.addEventListener('hashchange', () => { persistEditing(); S.fiche = null; renderFiche(); S.editing = null; S.editingTpl = null; S.picker = null; S.confirm = null; renderSheet(); S.view = viewFromHash(); render(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if (document.hidden) persistEditing(); });
window.addEventListener('pagehide', persistEditing);
let rsT = null;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.view === 'progression') drawProgressChart(); }, 150); });

/* ---------- Démarrage ---------- */
function start(data){
  data = data || {};
  S.view = viewFromHash();
  if (data.prog && METRICS[data.prog.metric]) S.prog = {exId:data.prog.exId || null, metric:data.prog.metric};
  if (data.editingId) S.wantEdit = data.editingId;
  render();
  initStore();
}
start({});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
</script>
